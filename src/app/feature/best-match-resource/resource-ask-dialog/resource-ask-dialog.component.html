<h1 mat-dialog-title>Overview by AI</h1>
<div mat-dialog-content>

  <div class="q-text">
    @if(docfile.qualification == null || docfile.qualification.trim() == '' || loadingDoc) {
      <div class="loader loader--text" style="width: 60%;"></div>
      <div class="loader loader--text" style="width: 80%;"></div>
      <div class="loader loader--text" style="width: 40%;"></div>
      <div class="loader loader--rectangle"></div>
    } @else {
      <div class="">{{docfile.qualification}}</div>
    }
  </div>

  <div class="ask-form">
    <form (ngSubmit)="askAi()" class="d-flex gap-2">
      <mat-form-field class="flex-item w-100" appearance="outline">
        <input matInput class="" placeholder="Ask something..." [(ngModel)]="question" name="question" required>
        <mat-icon matSuffix>info</mat-icon>
      </mat-form-field>
      <button mat-fab  class="flex-item flex-shrink-1 custom-chat-btn"  matSuffix type="submit" aria-label="Send">
        <mat-icon>send</mat-icon>
      </button>
    </form>
  </div>




</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Close</button>
  <button mat-button [mat-dialog-close]="docfile" cdkFocusInitial>Ok</button>
</div>
